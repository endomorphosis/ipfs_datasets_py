[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipfs_datasets_py"
version = "0.2.0"
description = "IPFS-native decentralized AI data platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
# Dependencies are resolved dynamically from setup.py so editable installs can
# prefer the vendored ipfs_kit_py/ipfs_accelerate_py checkouts when present.
dynamic = ["dependencies"]

[tool.ipfs-datasets-py.dependency-inventory]
schema-version = "ipfs-datasets-dependency-inventory/v1"
runtime-authority = "setup.py:install_requires"
requirements-txt-role = "source-checkout-development-and-integration"
requirements-lazy-role = "eager-superset-of-first-use-lazy-catalog"
requirements-theorem-provers-role = "theorem-python-binding-profile"
parity-scope = "formal-verification-python-bindings"
shared-formal-verification-bindings = [
    "z3-solver",
    "cvc5",
    "pysmt",
    "beartype",
    "jsonschema",
]
optional-formal-verification-bindings = ["symbolicai"]
external-native-tools-policy = "explicit-transactional-lazy-installer-only"

[tool.ipfs-accelerate-py.agent-supervisor.validation-dependencies]
schema = "ipfs_accelerate_py/agent-supervisor/validation-dependencies@1"
scope = "complete-authoritative-validation-environment"
files = ["requirements-agent-supervisor-validation.txt"]

[tool.ipfs-accelerate-agent-supervisor.project-dependency-preflight]
schema = "ipfs_accelerate_py/agent-supervisor/scoped-project-dependency-preflight@3"
requires-python = ">=3.12"
authority = { file = "setup.py", sha256 = "e81729d67ead3f6baef6b232b8f4650d15342387a9b3cfaa43844294e09a4a4f", extra = "lgcvf-validation", extra-requirements-sha256 = "c26af06e090d70c0c9cca2adc9a07899b36299cb72ceb60045bbd5b795bfa001" }

# Each entry binds one exact board task and validation command to a reviewed
# subset of setup.py's local-only lgcvf-validation profile.  That profile
# reuses existing base/test pins and does not broaden mandatory installation.
# A present baseline is content-sealed.
# A declared-output-absent baseline authorizes dependency probing only; the
# task must still create the exact declared output and pass normal validation.
[[tool.ipfs-accelerate-agent-supervisor.project-dependency-preflight.targets]]
target = "tests/unit/logic/gui_optimizer/test_models.py"
validation-command-sha256 = "a9ccd05c1e29f8e676248b06b303671e04ba6134d75a935e5c0fb523726f80ab"
requirements = ["pytest>=9.0.3,<10.0.0"]

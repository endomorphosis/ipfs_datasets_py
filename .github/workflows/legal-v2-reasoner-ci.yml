        SHARD = int(os.environ["REVIEWED_VALIDATION_SHARD"])
        SHARDS_BY_GROUP = {"cpu": 8, "parent": 2}
        assert GROUP in SHARDS_BY_GROUP
        SHARDS = SHARDS_BY_GROUP[GROUP]
        assert 0 <= SHARD < SHARDS
        PREFIX = f"reviewed-decoder-cpu-{SHARD}" if GROUP == "cpu" else f"reviewed-parent-route-{SHARD}"
        SCHEMA = f"legal-autoformal-{GROUP}-shard/v1"
        ROOT = Path.cwd().resolve()

        def node_id(item):
            return item.path.resolve().relative_to(ROOT).as_posix() + "::" + item.nodeid.split("::", 1)[1]

        def weight(node):
            return WEIGHTS.get(node.split("[", 1)[0].rsplit("/", 1)[-1], 2)

        class Shard:
            @pytest.hookimpl(trylast=True)
            def pytest_collection_modifyitems(self, config, items):
                # Run after pytest's complete -k selection. Assignment uses actual relative nodeIDs.
                nodes = {node_id(item): item for item in items}
                assert len(nodes) == len(items), "duplicate repository-relative test nodeID"
                loads = [0] * SHARDS
                partitions = [[] for _ in loads]
                for node in sorted(nodes, key=lambda value: (-weight(value), value)):
                    index = min(range(SHARDS), key=lambda value: (loads[value], value))
                    partitions[index].append(node)
                    loads[index] += weight(node)
                selected = set(partitions[SHARD])
                assert selected, "empty validation shard; update the bounded matrix"
                rejected = [item for node, item in nodes.items() if node not in selected]
                config.hook.pytest_deselected(items=rejected)
                items[:] = [item for node, item in nodes.items() if node in selected]
                Path(f"{PREFIX}-collection.json").write_text(json.dumps({
                    "schema": SCHEMA, "shard": SHARD, "shards": SHARDS,
                    "all_nodeids": sorted(nodes), "selected_nodeids": sorted(selected),
                    "weighted_seconds": loads[SHARD], "all_weighted_seconds": loads,
                }, sort_keys=True, indent=2) + "\n")

        ARGS_BY_GROUP = {'cpu': ['--noconftest', '-c', '/dev/null', '--assert=plain', '--import-mode=importlib', 'tests/unit/optimizers/logic_theorem_optimizer/test_autoencoder_training_worker.py', 'tests/unit/logic/test_autoformal_campaign_training_inputs.py', 'tests/unit/optimizers/logic_theorem_optimizer/test_legal_ir_evaluation_artifacts.py', '-k', '(reviewed_Qwen2_ or reviewed_pinned_Qwen25_candidate or reviewed_actual_Smollm2_full_rich_chatml_reservation_requires_longer_context or reviewed_cached_gpt2_complete_target_preflight or reviewed_torch or reviewed_tokenizer or reviewed_actual_fast or reviewed_production_wrapper or reviewed_generation or reviewed_profiled_generation or reviewed_decoder_artifact or source_only_generation or reviewed_local_loader or reviewed_retention or reviewed_producer_v3 or reviewed_producer_typed_structure_ or reviewed_mixed or reviewed_component or retains_one_signed_component or withdrawn_parent_can_be_followed or retains_adds_and_corrects or reviewed_profiled_retention_)'], 'parent': ['--noconftest', '-c', '/dev/null', '--assert=plain', '--import-mode=importlib', '-p', 'ipfs_datasets_py.optimizers.logic_theorem_optimizer.validation_pytest', 'tests/unit/optimizers/logic_theorem_optimizer/test_autoencoder_campaign_process.py', 'tests/unit/optimizers/logic_theorem_optimizer/test_autoencoder_inference.py', '-k', '(reviewed_parent_callback_ or reviewed_inference_ or reviewed_dependency_prefix_ or reviewed_network_fixed_soname_)']}
        ARGS = ARGS_BY_GROUP[GROUP] + [
            "--basetemp=" + (f"{PREFIX}-cases" if GROUP == "cpu" else str(ROOT / f"{PREFIX}-cases")),
            "-q", "--tb=short", "--junitxml=" + (f"legal-reviewed-decoder-cpu-{SHARD}-junit.xml"
                if GROUP == "cpu" else f"legal-reviewed-parent-route-{SHARD}-junit.xml"),
        ]
        raise SystemExit(pytest.main(ARGS, plugins=[Shard()]))
        PYTEST_SHARD
      if: ${{ matrix.group == 'cpu' || matrix.group == 'parent' }}
    - name: Run reviewed semantic admission controls
      env:
        IPFS_DATASETS_RUN_NATIVE_LEAN: '0'
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python -m pytest -c /dev/null --noconftest \
          tests/unit/optimizers/logic_theorem_optimizer/test_legal_span_consumer_binding.py \
          tests/unit/logic/autoformal/test_legal_norm_content_adjudication_v1.py \
          tests/unit/logic/autoformal/test_legal_reviewed_norm_admission_v3.py \
          tests/unit/logic/autoformal/test_corpus_norm_definition_adapter.py \
          -q --tb=short --junitxml=legal-reviewed-admission-junit.xml
      if: ${{ matrix.group == 'admission' }}
    - name: Run actual unary, relational and counted preservation
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python -m pytest -c /dev/null --noconftest \
          tests/unit/logic/autoformal/test_legal_native_ast_preservation_native.py \
          -k installed_lean --basetemp=native-preservation-cases \
          -v --tb=short --junitxml=native-preservation-junit.xml
      if: ${{ matrix.group == 'native' }}
    - name: Retain validation evidence for ${{ matrix.lane }}
      if: ${{ always() && matrix.group != 'cpu' && matrix.group != 'parent' }}
      uses: actions/upload-artifact@v4
      with:
        name: legal-autoformal-${{ matrix.lane }}-v3
        if-no-files-found: error
        path: |
          native-lean-v3-result.json
          native-lean-cases/**/native-lean-proof-cache-v3.json
          native-lean-cases/**/quoted-identifier-expected-goal-outcome.json
          native-lean-v3-junit.xml
          legal-autoformal-contracts-junit.xml
          legal-preservation-contracts-junit.xml
          native-preservation-junit.xml
          legal-reviewed-retrieval-junit.xml
          legal-reviewed-parent-route-junit.xml
          legal-reviewed-admission-junit.xml
          legal-source-withheld-cycle-junit.xml
          legal-proof-feedback-trust-junit.xml
          native-preservation-cases/**/installed-legacy-unary/**
          native-preservation-cases/**/installed-relational-*/**
          native-preservation-cases/**/installed-counted-three/**
          native-preservation-cases/**/installed-mixed-*/**
    - name: Retain bounded validation shard evidence
      if: ${{ always() && (matrix.group == 'cpu' || matrix.group == 'parent') }}
      uses: actions/upload-artifact@v4
      with:
        name: legal-autoformal-${{ matrix.group }}-${{ matrix.shard }}-v3
        if-no-files-found: error
        path: |
          legal-reviewed-decoder-cpu-${{ matrix.shard }}-junit.xml
          reviewed-decoder-cpu-${{ matrix.shard }}-collection.json
          legal-reviewed-parent-route-${{ matrix.shard }}-junit.xml
          reviewed-parent-route-${{ matrix.shard }}-collection.json
  legal-autoformal-native-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ always() }}
    needs:
    - legal-autoformal-validation
    steps:
    - name: Require every bounded validation lane
      env:
        VALIDATION_RESULT: ${{ needs.legal-autoformal-validation.result }}
      run: |
        if [ "$VALIDATION_RESULT" != success ]; then
          echo "A validation lane failed, was cancelled, or was skipped: $VALIDATION_RESULT"
          exit 1
        fi
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - uses: actions/download-artifact@v4
      with:
        pattern: legal-autoformal-cpu-*-v3
        path: cpu-shard-coverage
        merge-multiple: true
    - uses: actions/download-artifact@v4
      with:
        pattern: legal-autoformal-parent-*-v3
        path: parent-shard-coverage
        merge-multiple: true
    - name: Verify complete disjoint CPU and parent coverage
      run: |
        python - <<'PYTEST_COVERAGE'
        from pathlib import Path
        import json

        GROUPS = {"cpu": (8, "cpu-shard-coverage", "reviewed-decoder-cpu"),
                  "parent": (2, "parent-shard-coverage", "reviewed-parent-route")}
        all_seen = set()
        for group, (count, directory, prefix) in GROUPS.items():
            files = sorted(Path(directory).rglob(f"{prefix}-*-collection.json"))
            assert len(files) == count, f"all {count} {group} shard manifests are required"
            reports = [json.loads(path.read_text()) for path in files]
            assert all(type(report["shard"]) is int for report in reports)
            assert {report["shard"] for report in reports} == set(range(count))
            expected = reports[0]["all_nodeids"]
            assert expected and len(expected) == len(set(expected))
            seen = set()
            for report in reports:
                assert report["schema"] == f"legal-autoformal-{group}-shard/v1" and report["shards"] == count
                assert report["all_nodeids"] == expected, f"{group} jobs collected different selected populations"
                selected = report["selected_nodeids"]
                assert selected and len(selected) == len(set(selected)) and not seen.intersection(selected)
                seen.update(selected)
            assert seen == set(expected), f"{group} coverage is missing or contains foreign test nodes"
            assert not all_seen.intersection(seen), "validation groups execute overlapping test nodes"
            all_seen.update(seen)
            print(f"Verified {len(expected)} selected {group} cases exactly once across {count} shards.")
        PYTEST_COVERAGE

name: Legal V2 Reasoner CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "ipfs_datasets_py/processors/legal_data/reasoner/**"
      - "ipfs_datasets_py/logic/autoformal/**"
      - "ipfs_datasets_py/logic/legal_ir/**"
      - "ipfs_datasets_py/logic/formalization/autoencoder/**"
      - "ipfs_datasets_py/optimizers/logic_theorem_optimizer/**"
      - "tests/unit/optimizers/logic_theorem_optimizer/test_legal_*.py"
      - "tests/unit/optimizers/logic_theorem_optimizer/test_autoencoder_training_worker.py"
      - "tests/unit/optimizers/logic_theorem_optimizer/test_autoencoder_campaign_process.py"
      - "tests/unit/optimizers/logic_theorem_optimizer/test_autoencoder_inference.py"
      - "scripts/ops/legal_ir/run_incremental_autoencoders.py"
      - "tests/unit/logic/test_autoformal_campaign_training_inputs.py"
      - "tests/unit/logic/test_autoformal_reviewed_context_sharing.py"
      - "tests/unit/logic/formalization/autoencoder/test_alignment_relation_*.py"
      - "tests/unit/logic/formalization/autoencoder/test_alignment_richer_embeddings.py"
      - "tests/unit/logic/formalization/autoencoder/test_alignment_lane_bundle.py"
      - "tests/unit/logic/formalization/autoencoder/test_source_embeddings_384_device.py"
      - "tests/unit/optimizers/logic_theorem_optimizer/test_autoencoder_embedding_runtime.py"
      - "tests/unit/optimizers/logic_theorem_optimizer/test_autoencoder_embedding_production.py"
      - "tests/fixtures/legal_ir/joint_retrieval/**"
      - "ipfs_datasets_py/logic/integration/reasoning/**"
      - "tests/unit/logic/integration/test_hammer.py"
      - "tests/unit/logic/integration/test_legal_ir_*.py"
      - "ipfs_datasets_py/logic/backends/**"
      - "ipfs_datasets_py/logic/ir_core/**"
      - "ipfs_datasets_py/logic/common/duckdb_proof_*.py"
      - "tests/fixtures/legal_ir/proof_cache/**"
      - "tests/unit/logic/legal_ir/test_proof_cache.py"
      - "tests/unit/logic/legal_ir/test_extended_decompiler.py"
      - "tests/unit/logic/test_duckdb_proof_migration.py"
      - "tests/unit/logic/test_duckdb_proof_store.py"
      - "tests/unit/logic/autoformal/**"
      - "tests/integration/logic/backends/test_kernel_backends.py"
      - "tests/reasoner/test_hybrid_v2_*.py"
      - "tests/reasoner/test_kg_enrichment_adapter.py"
      - "tests/reasoner/test_prover_backend_registry.py"
      - "tests/reasoner/fixtures/cnl_parse_replay_v2_corpus.json"
      - "tests/reasoner/fixtures/cnl_parse_paraphrase_equivalence_v2.json"
      - "tests/reasoner/fixtures/compiler_parity_v2_cases.json"
      - "tests/reasoner/fixtures/hybrid_v2_api_schema_snapshot.json"
      - "docs/guides/legal_data/HYBRID_LEGAL_REASONING_OPERATIONS_RUNBOOK.md"
      - ".vscode/tasks.json"
      - ".github/workflows/legal-v2-reasoner-ci.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "ipfs_datasets_py/processors/legal_data/reasoner/**"
      - "ipfs_datasets_py/logic/autoformal/**"
      - "ipfs_datasets_py/logic/legal_ir/**"
      - "ipfs_datasets_py/logic/formalization/autoencoder/**"
      - "ipfs_datasets_py/optimizers/logic_theorem_optimizer/**"
      - "tests/unit/optimizers/logic_theorem_optimizer/test_legal_*.py"
      - "tests/unit/optimizers/logic_theorem_optimizer/test_autoencoder_training_worker.py"
      - "tests/unit/optimizers/logic_theorem_optimizer/test_autoencoder_campaign_process.py"
      - "tests/unit/optimizers/logic_theorem_optimizer/test_autoencoder_inference.py"
      - "scripts/ops/legal_ir/run_incremental_autoencoders.py"
      - "tests/unit/logic/test_autoformal_campaign_training_inputs.py"
      - "tests/unit/logic/test_autoformal_reviewed_context_sharing.py"
      - "tests/unit/logic/formalization/autoencoder/test_alignment_relation_*.py"
      - "tests/unit/logic/formalization/autoencoder/test_alignment_richer_embeddings.py"
      - "tests/unit/logic/formalization/autoencoder/test_alignment_lane_bundle.py"
      - "tests/unit/logic/formalization/autoencoder/test_source_embeddings_384_device.py"
      - "tests/unit/optimizers/logic_theorem_optimizer/test_autoencoder_embedding_runtime.py"
      - "tests/unit/optimizers/logic_theorem_optimizer/test_autoencoder_embedding_production.py"
      - "tests/fixtures/legal_ir/joint_retrieval/**"
      - "ipfs_datasets_py/logic/integration/reasoning/**"
      - "tests/unit/logic/integration/test_hammer.py"
      - "tests/unit/logic/integration/test_legal_ir_*.py"
      - "ipfs_datasets_py/logic/backends/**"
      - "ipfs_datasets_py/logic/ir_core/**"
      - "ipfs_datasets_py/logic/common/duckdb_proof_*.py"
      - "tests/fixtures/legal_ir/proof_cache/**"
      - "tests/unit/logic/legal_ir/test_proof_cache.py"
      - "tests/unit/logic/legal_ir/test_extended_decompiler.py"
      - "tests/unit/logic/test_duckdb_proof_migration.py"
      - "tests/unit/logic/test_duckdb_proof_store.py"
      - "tests/unit/logic/autoformal/**"
      - "tests/integration/logic/backends/test_kernel_backends.py"
      - "tests/reasoner/test_hybrid_v2_*.py"
      - "tests/reasoner/test_kg_enrichment_adapter.py"
      - "tests/reasoner/test_prover_backend_registry.py"
      - "tests/reasoner/fixtures/cnl_parse_replay_v2_corpus.json"
      - "tests/reasoner/fixtures/cnl_parse_paraphrase_equivalence_v2.json"
      - "tests/reasoner/fixtures/compiler_parity_v2_cases.json"
      - "tests/reasoner/fixtures/hybrid_v2_api_schema_snapshot.json"
      - "docs/guides/legal_data/HYBRID_LEGAL_REASONING_OPERATIONS_RUNBOOK.md"
      - ".vscode/tasks.json"
      - ".github/workflows/legal-v2-reasoner-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  legal-v2-reasoner-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .

      - name: Run Hybrid V2 reasoner suite
        id: v2suite
        shell: bash
        run: |
          set +e
          PYTHONPATH=src:${GITHUB_WORKSPACE} python -m pytest \
            tests/reasoner/test_hybrid_v2_blueprint.py \
            tests/reasoner/test_hybrid_v2_cli.py \
            tests/reasoner/test_hybrid_v2_parse_replay.py \
            tests/reasoner/test_hybrid_v2_compiler_parity.py \
            tests/reasoner/test_hybrid_v2_query_api_matrix.py \
            tests/reasoner/test_kg_enrichment_adapter.py \
            tests/reasoner/test_prover_backend_registry.py -q \
            2>&1 | tee legal-v2-reasoner-suite.log
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload failure log artifact
        if: steps.v2suite.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: legal-v2-reasoner-suite-log
          path: legal-v2-reasoner-suite.log
          retention-days: 7

      - name: Fail workflow on test failure
        if: steps.v2suite.outputs.exit_code != '0'
        run: |
          echo "Hybrid V2 reasoner suite failed. See uploaded log artifact."
          exit 1

  legal-v2-schema-drift-sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .

      - name: Run schema drift sentinel tests
        id: schemasentinel
        shell: bash
        run: |
          set +e
          PYTHONPATH=src:${GITHUB_WORKSPACE} python -m pytest \
            tests/reasoner/test_hybrid_v2_query_api_matrix.py::test_v2_query_api_schema_snapshot_lockfile \
            tests/reasoner/test_hybrid_v2_query_api_matrix.py::test_v2_query_api_json_schemas_match_runtime_required_keys \
            -q 2>&1 | tee legal-v2-schema-drift-sentinel.log
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload schema sentinel failure artifact
        if: steps.schemasentinel.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: legal-v2-schema-drift-sentinel-log
          path: legal-v2-schema-drift-sentinel.log
          retention-days: 7

      - name: Fail schema sentinel on error
        if: steps.schemasentinel.outputs.exit_code != '0'
        run: |
          echo "Schema drift sentinel failed. See uploaded log artifact."
          exit 1

  legal-v2-prover-backend-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        backend_id:
          - mock_smt
          - mock_fol

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .

      - name: Run backend smoke (${{ matrix.backend_id }})
        id: backendsmoke
        shell: bash
        run: |
          set +e
          PYTHONPATH=src:${GITHUB_WORKSPACE} python - <<'PY' 2>&1 | tee legal-v2-backend-smoke-${{ matrix.backend_id }}.log
          from ipfs_datasets_py.processors.legal_data.reasoner.v2_cli import run_v2_cli

          payload = run_v2_cli(
              sentences=["Controller shall report breach within 24 hours."],
              jurisdiction="us/federal",
              enable_optimizer=True,
              enable_kg=True,
              enable_prover=True,
              prover_backend_id="${{ matrix.backend_id }}",
          )

          summary = payload.get("summary") or {}
          assert summary.get("total") == 1, summary
          assert summary.get("ok") == 1, summary
          assert summary.get("error") == 0, summary
          assert summary.get("prover_backend_id") == "${{ matrix.backend_id }}", summary
          assert summary.get("schema_version") == "1.0", summary
          PY
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload backend smoke failure artifact
        if: steps.backendsmoke.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: legal-v2-backend-smoke-${{ matrix.backend_id }}-log
          path: legal-v2-backend-smoke-${{ matrix.backend_id }}.log
          retention-days: 7

      - name: Fail backend smoke on error
        if: steps.backendsmoke.outputs.exit_code != '0'
        run: |
          echo "Backend smoke failed for ${{ matrix.backend_id }}. See uploaded log artifact."
          exit 1

  legal-autoformal-validation:
    name: Legal autoformal validation (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
        - lane: native-lean
          group: native
          shard: 0
        - lane: contracts
          group: contracts
          shard: 0
        - lane: parent-0
          group: parent
          shard: 0
        - lane: parent-1
          group: parent
          shard: 1
        - lane: admission
          group: admission
          shard: 0
        - lane: cpu-0
          group: cpu
          shard: 0
        - lane: cpu-1
          group: cpu
          shard: 1
        - lane: cpu-2
          group: cpu
          shard: 2
        - lane: cpu-3
          group: cpu
          shard: 3
        - lane: cpu-4
          group: cpu
          shard: 4
        - lane: cpu-5
          group: cpu
          shard: 5
        - lane: cpu-6
          group: cpu
          shard: 6
        - lane: cpu-7
          group: cpu
          shard: 7
    env:
      IPFS_DATASETS_PY_MINIMAL_IMPORTS: '1'
      IPFS_DATASETS_PY_ENABLE_MCP_IMPORTS: '0'
      IPFS_DATASETS_PY_ENABLE_FASTAPI_IMPORTS: '0'
      IPFS_DATASETS_PY_ENABLE_FINANCE_DASHBOARD_IMPORTS: '0'
      IPFS_DATASETS_PY_ENABLE_LLM_IMPORTS: '0'
      IPFS_DATASETS_PY_WARN_OPTIONAL_IMPORTS: '0'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      IPFS_DATASETS_AUTO_INSTALL: '0'
      IPFS_KIT_AUTO_INSTALL_DEPS: '0'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      IPFS_DATASETS_RUN_NATIVE_LEAN: '1'
      IPFS_DATASETS_LEAN_VERSION: 4.34.1
      IPFS_DATASETS_NATIVE_LEAN_REPORT: native-lean-v3-result.json
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install focused Python test dependencies
      run: python -m pip install pytest==8.3.4 numpy==2.1.3 beartype duckdb multiformats cryptography requests rich huggingface_hub
        z3-solver transformers==5.19.0 tokenizers==0.23.3
    - name: Install pinned CPU retrieval test dependency
      run: python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
    - name: Restore pinned Lean toolchain
      id: lean-cache
      uses: actions/cache@v4
      with:
        path: ~/.elan/toolchains/leanprover--lean4---v4.34.1
        key: legal-autoformal-lean-4.34.1-${{ runner.os }}-${{ runner.arch }}
      if: ${{ matrix.group == 'native' }}
    - name: Install the pinned Lean toolchain
      if: ${{ matrix.group == 'native' && steps.lean-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/legal-ir-elan"
        curl --fail --location --retry 2 \
          https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz \
          --output "$RUNNER_TEMP/legal-ir-elan/elan.tar.gz"
        tar -xzf "$RUNNER_TEMP/legal-ir-elan/elan.tar.gz" -C "$RUNNER_TEMP/legal-ir-elan"
        "$RUNNER_TEMP/legal-ir-elan/elan-init" -y --no-modify-path \
          --default-toolchain leanprover/lean4:v4.34.1
    - name: Select the pinned executable
      shell: bash
      run: |
        printf '%s\n' "IPFS_DATASETS_LEAN_EXECUTABLE=$HOME/.elan/toolchains/leanprover--lean4---v4.34.1/bin/lean" >> "$GITHUB_ENV"
        printf '%s\n' "IPFS_DATASETS_NATIVE_LAKE_TEST_EXECUTABLE=$HOME/.elan/toolchains/leanprover--lean4---v4.34.1/bin/lake" >> "$GITHUB_ENV"
      if: ${{ matrix.group == 'native' }}
    - name: Run focused proof and cache contracts
      env:
        IPFS_DATASETS_RUN_NATIVE_LEAN: '0'
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python -m pytest -c /dev/null --noconftest \
          tests/integration/logic/backends/test_kernel_backends.py \
          tests/unit/logic/legal_ir/test_proof_cache.py \
          tests/unit/logic/autoformal/test_corpus_graph.py \
          tests/unit/logic/autoformal/test_legal_graph_dependencies.py \
          tests/unit/logic/test_duckdb_proof_migration.py \
          tests/unit/logic/test_duckdb_proof_store.py::test_exact_verification_cache_interop_bridge \
          tests/unit/logic/test_duckdb_proof_store.py::test_verification_cache_entry_can_be_put_directly \
          tests/unit/logic/test_duckdb_proof_store.py::test_advisory_verification_projection_uses_target_status_polarity \
          tests/unit/logic/test_duckdb_proof_store.py::test_store_put_retains_advisory_candidate_without_proof_authority \
          --deselect tests/integration/logic/backends/test_kernel_backends.py::test_lean_native_v2_expected_type_and_dependency_policy \
          --deselect tests/integration/logic/backends/test_kernel_backends.py::test_lean_native_v3_proof_cache_round_trip_and_exact_reuse_context \
          --deselect tests/integration/logic/backends/test_kernel_backends.py::test_lean_native_quoted_identifier_preserves_expected_goal \
          -q --tb=short --junitxml=legal-autoformal-contracts-junit.xml
      if: ${{ matrix.group == 'contracts' }}
    - name: Run actual Lean declaration, type and dependency controls
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python -m pytest -c /dev/null --noconftest \
          tests/integration/logic/backends/test_kernel_backends.py::test_lean_native_v2_expected_type_and_dependency_policy \
          tests/integration/logic/backends/test_kernel_backends.py::test_lean_native_v3_proof_cache_round_trip_and_exact_reuse_context \
          tests/integration/logic/backends/test_kernel_backends.py::test_lean_native_quoted_identifier_preserves_expected_goal \
          --basetemp=native-lean-cases \
          -v --tb=short --junitxml=native-lean-v3-junit.xml
      if: ${{ matrix.group == 'native' }}
    - name: Run preservation mutation and custody contracts
      env:
        IPFS_DATASETS_RUN_NATIVE_LEAN: '0'
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python -m pytest -c /dev/null --noconftest \
          tests/unit/logic/autoformal/test_legal_native_ast_preservation.py \
          tests/unit/logic/autoformal/test_legal_native_ast_preservation_native.py \
          -k 'not installed_lean' \
          -q --tb=short --junitxml=legal-preservation-contracts-junit.xml
      if: ${{ matrix.group == 'contracts' }}
    - name: Run Hammer and proof-feedback trust boundaries
      env:
        IPFS_DATASETS_RUN_NATIVE_LEAN: '0'
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python -m pytest -c /dev/null --noconftest \
          tests/unit/logic/integration/test_hammer.py \
          tests/unit/logic/integration/test_legal_ir_hammer_translation.py \
          tests/unit/logic/integration/test_legal_ir_proof_feedback.py \
          -q --tb=short --junitxml=legal-proof-feedback-trust-junit.xml
      if: ${{ matrix.group == 'contracts' }}
    - name: Run source-withheld surface cycle and canonical regressions
      env:
        IPFS_DATASETS_RUN_NATIVE_LEAN: '0'
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python -m pytest -c /dev/null --noconftest \
          tests/unit/logic/legal_ir/test_extended_decompiler.py \
          tests/unit/logic/legal_ir/test_canonical_decompiler.py \
          tests/unit/logic/legal_ir/test_canonical_decompiler_reconstruction.py \
          -q --tb=short --junitxml=legal-source-withheld-cycle-junit.xml
      if: ${{ matrix.group == 'contracts' }}
    - name: Run complete reviewed retrieval controls
      env:
        IPFS_DATASETS_RUN_NATIVE_LEAN: '0'
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python -m pytest -c /dev/null --noconftest \
          tests/unit/logic/formalization/autoencoder/test_alignment_relation_declarations.py \
          tests/unit/logic/formalization/autoencoder/test_alignment_relation_mask_handoff.py \
          tests/unit/logic/formalization/autoencoder/test_alignment_richer_embeddings.py \
          tests/unit/logic/formalization/autoencoder/test_alignment_lane_bundle.py \
          tests/unit/logic/formalization/autoencoder/test_source_embeddings_384_device.py \
          tests/unit/optimizers/logic_theorem_optimizer/test_autoencoder_embedding_runtime.py \
          tests/unit/optimizers/logic_theorem_optimizer/test_autoencoder_training_worker.py::test_actual_GTE_ranked_context_capacity_and_source_only_T5_baseline \
          tests/unit/optimizers/logic_theorem_optimizer/test_autoencoder_training_worker.py::test_actual_GTE_shorttag_complete_context_reaches_local_T5 \
          tests/unit/optimizers/logic_theorem_optimizer/test_autoencoder_embedding_production.py \
          tests/unit/optimizers/logic_theorem_optimizer/test_legal_joint_retrieval.py \
          tests/unit/optimizers/logic_theorem_optimizer/test_legal_ir_semantic_metrics.py \
          tests/unit/optimizers/logic_theorem_optimizer/test_legal_structured_retrieval.py \
          tests/unit/logic/test_autoformal_reviewed_context_sharing.py \
          -q --tb=short --junitxml=legal-reviewed-retrieval-junit.xml
      if: ${{ matrix.group == 'contracts' }}
    - name: Run bounded reviewed decoder and original-parent controls
      env:
        IPFS_DATASETS_RUN_NATIVE_LEAN: '0'
        IPFS_AUTO_INSTALL: 'false'
        IPFS_DATASETS_AUTO_INSTALL_TEST_DEPS: '0'
        TOKENIZERS_PARALLELISM: 'false'
        PYTHONDONTWRITEBYTECODE: '1'
        PYTHONPATH: ${{ github.workspace }}
        REVIEWED_VALIDATION_GROUP: ${{ matrix.group }}
        REVIEWED_VALIDATION_SHARD: ${{ matrix.shard }}
      run: |
        python - <<'PYTEST_SHARD'
        # Ceiling of the slowest saved case time for each function; parameters share the conservative weight.
        # Unknown/new selected cases use two seconds and remain part of this deterministic assignment.
        WEIGHTS = {
            'test_autoencoder_training_worker.py::test_reviewed_Qwen2_training_default_retains_raw_prompt_before_chatml_opt_in': 2,
            'test_autoencoder_training_worker.py::test_reviewed_Qwen2_training_invalid_profile_refuses_without_native_import': 1,
            'test_autoencoder_training_worker.py::test_reviewed_Qwen2_training_preflights_complete_batch_before_mutation': 1,
            'test_autoencoder_training_worker.py::test_reviewed_Qwen2_training_profile_checkpoint_identity_and_exact_resume': 3,
            'test_autoencoder_training_worker.py::test_reviewed_Qwen2_training_profile_existing_mixed_job_preserves_complete_targets': 77,
            'test_autoencoder_training_worker.py::test_reviewed_Qwen2_training_profile_mutation_after_forward_refuses_before_backward': 1,
            'test_autoencoder_training_worker.py::test_reviewed_Qwen2_training_profile_rejects_other_architecture_or_runtime': 1,
            'test_autoencoder_training_worker.py::test_reviewed_Qwen2_training_recipe_refuses_closed_data_before_allocation': 1,
            'test_autoencoder_training_worker.py::test_reviewed_Qwen2_training_recipe_restores_profile_without_training': 1,
            'test_autoencoder_training_worker.py::test_reviewed_Qwen2_training_selected_chatml_matches_native_frame_and_labels': 1,
            'test_autoencoder_inference.py::test_reviewed_inference_actual_Qwen25_rich_layout_typed_audit_physical_original_owner': 516,
            'test_autoencoder_inference.py::test_reviewed_inference_actual_Qwen25_source_layout_typed_audit_physical_original_owner': 174,
            'test_autoencoder_inference.py::test_reviewed_inference_parent_typed_audit_binds_complete_original_artifacts': 14,
            'test_autoencoder_inference.py::test_reviewed_inference_parent_typed_audit_cannot_be_enabled_by_packet': 2,

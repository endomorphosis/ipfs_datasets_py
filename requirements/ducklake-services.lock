# DQK-095 hermetic DuckLake multi-owner test-service lock.
#
# Immutable-digest pins for every artifact/image the owner-locked harness may
# materialize: DuckDB runtime, Quack, DuckLake, httpfs/object-store adapter,
# and the S3-compatible object store. Completing DQK-095 does not activate a
# candidate environment (DQK-103 remains the sole lifecycle owner).
#
# Policy scope: CPython 3.12 binary wheels on Linux aarch64 or x86_64.
# This lock is deliberately distinct from:
#   - requirements/duckdb-quack-bootstrap.lock  (supervisor runtime)
#   - requirements/duckdb-quack.lock            (DQK-082 candidate env)
#   - requirements/duckdb-quack-validator.lock  (validation wheel cache)
#
# Format (parsed by scripts/ops/ducklake_test_services.py):
#   profile.extension.<name>.<platform>.gz_sha256=<hex>
#   profile.extension.<name>.<platform>.bin_sha256=<hex>
#   profile.docker.<role>=<image@sha256:...>
#   profile.setting.<key>=<value>
#   profile.capability.<key>=<value>
#   package lines use pip require-hashes grammar

